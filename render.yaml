services:
  - type: web
    name: purepoint
    runtime: node
    plan: free
    buildCommand: tar -xzf PurePoint-source-latest.tar.gz && pnpm install --frozen-lockfile && pnpm run db:migrate && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
