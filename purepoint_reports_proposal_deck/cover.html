<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
.slide-container{width:1280px;min-height:720px;background:#f7fbfb;color:#12333b;font-family:Arial,"Tahoma",sans-serif;display:flex;position:relative;overflow:hidden}
.rail{width:22px;min-height:720px;background:#0d9488}
.content{width:72%;padding:112px 84px 0 64px}
.eyebrow{font-size:22px;color:#0d9488;font-weight:700;letter-spacing:.4px;margin-bottom:26px}
.title{font-size:64px;line-height:1.1;font-weight:800;margin:0 0 22px}
.subtitle{font-size:28px;line-height:1.45;color:#52666c;max-width:680px}
.footer{position:absolute;bottom:42px;right:86px;font-size:18px;color:#789096}
.visual{flex:1;position:relative;background:#e8f5f3}
.circle{position:absolute;width:360px;height:360px;border-radius:50%;background:#c8ebe6;top:95px;left:68px}
.panel{position:absolute;top:150px;left:92px;width:365px;min-height:300px;background:#fff;border:1px solid #d7e8e7;padding:26px;box-shadow:0 18px 40px rgba(18,51,59,.12)}
.panel-title{font-size:20px;font-weight:700;margin-bottom:22px;color:#12333b}
.metrics{display:flex;gap:12px;direction:rtl}
.metric{flex:1;background:#f3f9f8;padding:14px 10px;border-top:4px solid #0d9488}
.metric strong{display:block;font-size:25px;color:#12333b}
.metric span{font-size:13px;color:#6d8286}
.line{height:11px;background:#d6eeeb;margin-top:24px}
.line.short{width:68%}
.accent{position:absolute;width:80px;height:80px;border:10px solid #0d9488;right:48px;bottom:76px;border-radius:16px;transform:rotate(12deg)}
</style>
</head>
<body>
<div class="slide-container"><div class="rail"></div><div class="content"><div class="eyebrow">نقطة نقاء · مقترح تجربة المستخدم</div><h1 class="title">واجهة التقارير الجديدة</h1><p class="subtitle">تصميم أبسط يضع الإجابة أمام المستخدم، ثم يفتح التفاصيل عند الحاجة.</p><div class="footer">عرض مقترح للفريق</div></div><div class="visual"><div class="circle"></div><div class="panel"><div class="panel-title">ملخص الإدارة</div><div class="metrics"><div class="metric"><strong>15230</strong><span>إيرادات</span></div><div class="metric"><strong>4437</strong><span>مصروفات</span></div><div class="metric"><strong>10693</strong><span>الصافي</span></div></div><div class="line"></div><div class="line short"></div></div><div class="accent"></div></div>
</body>
</html>
