name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    name: Ping production service
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_URL: https://purepoint.onrender.com
    steps:
      - name: Ping /api/ping
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$RENDER_URL/api/ping")"
          echo "Render response: $response"
